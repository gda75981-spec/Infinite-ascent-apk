
name: Build Infinite Ascent APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Infinite_Ascent_Android_Project.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE="$(find . -maxdepth 4 -type f -name 'Infinite_Ascent_Android_Project.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found in repository."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/project"
          test -f "$RUNNER_TEMP/project/InfiniteAscentAndroid/settings.gradle"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          gradle -p "$RUNNER_TEMP/project/InfiniteAscentAndroid" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Infinite-Ascent-debug-apk
          path: ${{ runner.temp }}/project/InfiniteAscentAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
